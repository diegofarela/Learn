<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("learnThemeModeV1") || "dark";
          var theme =
            mode === "light" || mode === "dark"
              ? mode
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (err) {}
      })();
    </script>
    <title>Learn — CS concepts, visualized</title>
    <meta
      name="description"
      content="Every major computer science concept, organized and visualized in 3D so the idea sticks."
    />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/env.js"></script>
    <script src="js/catalog.js"></script>
  </head>
  <body>
    <div class="page-atmosphere" aria-hidden="true"></div>
    <header class="site-header">
      <div class="nav-inner">
        <a class="brand" href="index.html">Learn</a>
        <label class="theme-control">
          <span class="sr-only">Theme</span>
          <select id="theme-mode" aria-label="Color theme">
            <option value="dark" selected>Dark</option>
            <option value="light">Light</option>
            <option value="auto">Auto</option>
          </select>
        </label>
      </div>
    </header>

    <main class="hub-main">
      <header class="hub-hero">
        <p class="hub-kicker">Computer science atlas</p>
        <h1>Learn</h1>
        <p class="lede">
          Every major CS idea, one interactive visual at a time. Start with
          <a class="concept-link" href="concepts/stack.html">Stack</a>—then walk
          the map.
        </p>
      </header>

      <div id="catalog-root" class="catalog-root" aria-live="polite"></div>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/hub.js"></script>
    <script src="js/dev-tools.js"></script>
  </body>
</html>
