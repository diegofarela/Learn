<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script>
      (function () {
        try {
          var mode = localStorage.getItem("learnThemeModeV1") || "auto";
          var theme =
            mode === "light" || mode === "dark"
              ? mode
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          document.documentElement.dataset.theme = theme;
          document.documentElement.style.colorScheme = theme;
        } catch (err) {}
      })();
    </script>
    <title>Learn</title>
    <meta name="description" content="Learn — notes and lessons in one place." />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Sans+3:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/env.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="nav-inner">
        <a class="brand" href="index.html">Learn</a>
        <label class="theme-control">
          <span class="sr-only">Theme</span>
          <select id="theme-mode" aria-label="Color theme">
            <option value="auto">Auto</option>
            <option value="light">Light</option>
            <option value="dark">Dark</option>
          </select>
        </label>
      </div>
    </header>

    <main>
      <h1>Learn</h1>
      <p class="lede">A place for notes and lessons.</p>
    </main>

    <script src="js/theme.js"></script>
    <script src="js/dev-tools.js"></script>
  </body>
</html>
